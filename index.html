<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wishlist</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232d;
    --text: #e6edf3;
    --muted: #8b98a5;
    --border: #2a323d;
    --accent: #f5a623;
    --accent-soft: rgba(245, 166, 35, 0.15);
    --danger: #f0616d;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --text: #1a2028;
    --muted: #667180;
    --border: #e0e4ea;
    --accent: #e08b00;
    --accent-soft: rgba(224, 139, 0, 0.12);
    --danger: #d33b48;
    --shadow: 0 6px 20px rgba(20, 30, 45, 0.12);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .topbar h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .summary {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #1a1200;
    border-color: var(--accent);
    font-weight: 600;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 22px 20px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .control {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.9rem;
  }
  .control[type="search"] { flex: 1 1 180px; min-width: 160px; }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, border-color 0.2s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card-media { aspect-ratio: 4 / 3; background: var(--panel-2); overflow: hidden; }
  .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-img.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .card-title { margin: 0; font-size: 1rem; line-height: 1.3; }
  .card-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.95rem; }
  .price { font-weight: 700; color: var(--accent); }
  .store { color: var(--muted); font-size: 0.85rem; }
  .stars { letter-spacing: 2px; color: var(--muted); font-size: 1.05rem; }
  .star.on { color: var(--accent); }
  .star-picker { display: flex; align-items: center; gap: 2px; font-size: 1.5rem; letter-spacing: 2px; }
  .star-picker .star { cursor: pointer; color: var(--muted); user-select: none; transition: color 0.15s ease, transform 0.1s ease; }
  .star-picker .star:hover { transform: scale(1.15); }
  .star-picker .star.on { color: var(--accent); }
  .star-value { margin-left: 8px; font-size: 0.85rem; color: var(--muted); }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 0.75rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid transparent;
  }
  .tag {
    font-size: 0.75rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .note { margin: 0; font-size: 0.9rem; color: var(--text); opacity: 0.9; white-space: pre-wrap; }
  .card-link { color: var(--accent); font-size: 0.85rem; text-decoration: none; }
  .card-link:hover { text-decoration: underline; }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 48px 16px;
    border: 1px dashed var(--border);
    border-radius: 14px;
  }
  .empty-art { display: flex; justify-content: center; margin-bottom: 14px; color: var(--muted); }
  .empty-art svg { filter: drop-shadow(0 10px 24px rgba(245, 166, 35, 0.18)); }
  .empty-title { margin: 0 0 6px; font-size: 1.15rem; color: var(--text); }
  .empty-hint { margin: 0 auto; max-width: 42ch; font-size: 0.9rem; line-height: 1.5; }

  /* ===== Скелетоны на время загрузки ===== */
  @keyframes skeleton-sweep {
    from { background-position: -180% 0; }
    to { background-position: 280% 0; }
  }
  .skeleton-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .skeleton-media { aspect-ratio: 4 / 3; }
  .skeleton-body { padding: 14px; display: flex; flex-direction: column; gap: 9px; }
  .skeleton-line { height: 11px; border-radius: 6px; }
  .skeleton-title { width: 78%; height: 14px; }
  .skeleton-short { width: 46%; }
  .skeleton-tiny { width: 30%; height: 9px; }
  .skeleton-media,
  .skeleton-line {
    background-image: linear-gradient(
      100deg,
      var(--panel-2) 20%,
      rgba(255, 255, 255, 0.06) 45%,
      var(--panel-2) 70%
    );
    background-size: 220% 100%;
    animation: skeleton-sweep 1.5s linear infinite;
  }
  :root[data-theme="light"] .skeleton-media,
  :root[data-theme="light"] .skeleton-line {
    background-image: linear-gradient(
      100deg,
      var(--panel-2) 20%,
      rgba(0, 0, 0, 0.05) 45%,
      var(--panel-2) 70%
    );
  }

  /* ===== 3D-наклон карточки ===== */
  .card-tilt {
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform 0.18s var(--ease), border-color 0.25s var(--ease),
      box-shadow 0.3s var(--ease);
  }
  #test-output {
    display: none;
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 20px 40px;
    white-space: pre-wrap;
    font-family: "Consolas", "SFMono-Regular", monospace;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow: auto;
    z-index: 50;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 520px;
    padding: 22px;
  }
  .modal-title { margin: 0 0 14px; font-size: 1.15rem; }
  .modal-form { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 0.8rem; color: var(--muted); }
  .field-input {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 0.92rem;
    font-family: inherit;
    width: 100%;
  }
  textarea.field-input { min-height: 84px; resize: vertical; }
  .field-input:focus { outline: none; border-color: var(--accent); }
  .image-preview {
    width: 100%;
    max-height: 200px;
    object-fit: contain;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .image-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .hidden-file { display: none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .card-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-sm { padding: 5px 10px; font-size: 0.8rem; border-radius: 8px; }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .auth-user {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 0.85rem;
    max-width: 260px;
    min-width: 0;
    vertical-align: middle;
  }
  .auth-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: none;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .auth-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auth-note { color: var(--danger); font-size: 0.78rem; max-width: 260px; line-height: 1.3; }
  .reserve { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
  .reserve-label { font-size: 0.82rem; color: var(--accent); font-weight: 600; }

  /* ===== Визуальный слой: свечение, анимации, микровзаимодействия ===== */
  :root {
    --glow: 0 0 0 1px rgba(245, 166, 35, 0.35), 0 10px 34px rgba(245, 166, 35, 0.18);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  :root[data-theme="light"] {
    --glow: 0 0 0 1px rgba(224, 139, 0, 0.28), 0 10px 28px rgba(224, 139, 0, 0.16);
  }

  /* Мягкие цветовые пятна на фоне */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(60rem 32rem at 12% -8%, var(--accent-soft), transparent 65%),
      radial-gradient(48rem 28rem at 92% 4%, rgba(96, 165, 250, 0.10), transparent 60%);
    opacity: 0.9;
  }

  .topbar {
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
  }
  .topbar h1 {
    background: linear-gradient(92deg, var(--text), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* Кнопки */
  .btn {
    transition: background 0.2s var(--ease), border-color 0.2s var(--ease),
      transform 0.12s var(--ease), box-shadow 0.25s var(--ease);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); }
  .btn:active { transform: translateY(0) scale(0.97); }
  .btn-primary { box-shadow: 0 6px 20px rgba(245, 166, 35, 0.22); }
  .btn-primary:hover { box-shadow: 0 10px 28px rgba(245, 166, 35, 0.38); }
  .btn:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }
  .btn:focus-visible, .control:focus-visible, .field-input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Карточки: каскадное появление и подсветка при наведении */
  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  .card {
    animation: card-in 0.45s var(--ease) both;
    transition: transform 0.25s var(--ease), border-color 0.25s var(--ease),
      box-shadow 0.3s var(--ease);
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: var(--accent);
    box-shadow: var(--glow);
  }
  .card-img { transition: transform 0.5s var(--ease); }
  .card:hover .card-img { transform: scale(1.045); }

  /* Блик на заглушке «нет фото» */
  @keyframes shimmer {
    from { background-position: -160% 0; }
    to { background-position: 260% 0; }
  }
  .card-img.placeholder {
    background-image: linear-gradient(
      100deg,
      transparent 20%,
      var(--accent-soft) 45%,
      transparent 70%
    );
    background-size: 220% 100%;
    animation: shimmer 2.6s linear infinite;
  }

  /* Забронированный айтем у админа: спокойная метка, без имён */
  .card-reserved { border-color: rgba(96, 165, 250, 0.5); }
  .card-reserved:hover {
    border-color: rgba(96, 165, 250, 0.85);
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.4), 0 10px 30px rgba(96, 165, 250, 0.2);
  }

  /* Подаренный айтем: приглушаем, чтобы не путался с актуальными желаниями */
  .card-gifted { border-color: rgba(74, 222, 128, 0.42); opacity: 0.82; }
  .card-gifted:hover { opacity: 1; border-color: rgba(74, 222, 128, 0.7); }
  .card-gifted .card-media img { filter: saturate(0.75); }
  .badge-gifted {
    background: rgba(74, 222, 128, 0.14);
    border-color: rgba(74, 222, 128, 0.5);
    color: #4ade80;
  }
  .badge-gifted::before {
    content: "✓";
    margin-right: 4px;
  }

  /* 5 звёзд: неоновая переливающаяся рамка + пульсация свечения */
  @keyframes neon-flow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes neon-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .card-hot {
    position: relative;
    border-color: transparent;
    background-image:
      linear-gradient(var(--panel), var(--panel)),
      linear-gradient(120deg, #f5a623, #ff6ec7, #6ea8ff, #f5a623);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    background-size: 100% 100%, 300% 300%;
    animation: card-in 0.45s var(--ease) both, neon-flow 6s ease-in-out infinite;
  }
  .card-hot::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 14px;
    pointer-events: none;
    box-shadow:
      0 0 18px rgba(245, 166, 35, 0.45),
      0 0 42px rgba(255, 110, 199, 0.22);
    animation: neon-pulse 3.4s ease-in-out infinite;
  }
  .card-hot:hover::after {
    box-shadow:
      0 0 24px rgba(245, 166, 35, 0.65),
      0 0 60px rgba(255, 110, 199, 0.35);
  }
  .card-hot:hover {
    border-color: transparent;
    box-shadow: 0 14px 44px rgba(245, 166, 35, 0.3);
  }
  .card-hot .card-title {
    background: linear-gradient(92deg, var(--text), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stars-hot { color: var(--accent); text-shadow: 0 0 10px rgba(245, 166, 35, 0.55); }
  .stars-hot .star.on {
    animation: star-twinkle 2.6s ease-in-out infinite;
  }
  .stars-hot .star.on:nth-child(2) { animation-delay: 0.18s; }
  .stars-hot .star.on:nth-child(3) { animation-delay: 0.36s; }
  .stars-hot .star.on:nth-child(4) { animation-delay: 0.54s; }
  .stars-hot .star.on:nth-child(5) { animation-delay: 0.72s; }
  @keyframes star-twinkle {
    0%, 100% { text-shadow: 0 0 8px rgba(245, 166, 35, 0.5); }
    50% { text-shadow: 0 0 16px rgba(245, 166, 35, 0.95), 0 0 26px rgba(255, 110, 199, 0.45); }
  }

  /* 4 звезды: заметно, но сдержаннее — ровное тёплое свечение без перелива */
  .card-warm {
    border-color: rgba(245, 166, 35, 0.42);
    box-shadow: 0 6px 22px rgba(245, 166, 35, 0.14);
    transition: box-shadow 0.3s var(--ease), border-color 0.25s var(--ease),
      transform 0.25s var(--ease);
  }
  .card-warm:hover {
    border-color: rgba(245, 166, 35, 0.75);
    box-shadow: 0 10px 30px rgba(245, 166, 35, 0.26);
  }
  .card-warm .stars { color: var(--accent); text-shadow: 0 0 6px rgba(245, 166, 35, 0.35); }

  /* ===== Раскрытие карточки ===== */
  .card { cursor: pointer; }
  .view {
    max-width: 900px;
    position: relative;
    padding: 0;
    overflow: hidden;
    margin: auto; /* центрируем по вертикали, не обрезая высокое содержимое */
  }
  .view-close {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    font-size: 1.35rem;
    line-height: 1;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text);
    background: rgba(14, 17, 22, 0.6);
    border: 1px solid var(--border);
    backdrop-filter: blur(6px);
    transition: background 0.2s var(--ease), transform 0.15s var(--ease);
  }
  .view-close:hover { background: var(--danger); transform: rotate(90deg); }
  .view-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
  /* Картинка сохраняет свои пропорции: без фиксированного aspect-ratio и обрезки */
  .view-media {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 180px;
    padding: 18px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .view-img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 52vh;
    object-fit: contain;
    border-radius: 12px;
  }
  .view-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    min-width: 0;
    padding: 20px 22px 22px;
  }
  .view-title {
    margin: 0;
    padding-right: 44px; /* не заезжаем под кнопку закрытия */
    font-size: 1.3rem;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .view-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: baseline;
    font-size: 1.05rem;
  }
  .view-info .stars { font-size: 1.2rem; }
  .view-info .card-tags { padding: 2px 0 0; }
  .view-note {
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
    color: var(--text);
    opacity: 0.92;
  }
  .view-link { margin-top: 6px; display: inline-block; text-decoration: none; }
  .view-info .reserve { margin-top: 6px; width: 100%; }
  @media (min-width: 720px) {
    .view-grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    .view-grid.single { grid-template-columns: minmax(0, 1fr); }
    .view-media { border-bottom: 0; border-right: 1px solid var(--border); }
    .view-info { padding: 22px; }
  }
  .badge-reserved::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }
  @keyframes reserved-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.62; }
  }

  /* Модальные окна */
  @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to { opacity: 1; transform: none; }
  }
  .modal-overlay {
    animation: overlay-in 0.18s ease both;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .modal { animation: modal-in 0.28s var(--ease) both; }

  .field-input { transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease); }
  .field-input:focus { box-shadow: 0 0 0 3px var(--accent-soft); }

  .empty { animation: card-in 0.4s var(--ease) both; }

  /* Скроллбар */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
  }

<script id="app">
/* ===== Конфигурация Supabase =====
   url — Project URL вида https://<project-ref>.supabase.co (НЕ адрес панели
   dashboard.supabase.com).
   key — publishable key (sb_publishable_...) из Project Settings → API Keys.

   он обходит все правила доступа.
   Пока key пустой — приложение работает в демо-режиме на localStorage. */
const SUPABASE_CONFIG = {
  url: 'https://lnafryewimjvcupuoczp.supabase.co',
  key: 'sb_publishable_1wkK0B5U22QOhP5lylM0hQ_hLUumoca',
};

/* ===== Модель айтема ===== */
function statusFromRating(rating) {
  const r = Math.max(0, Math.min(5, parseInt(rating, 10) || 0));
  if (r === 5) return 'очень хочу';
  if (r === 4) return 'сильно хочу';
  if (r === 3) return 'хочу';
  if (r >= 1) return 'если что';
  return 'без оценки';
}

// Уникальные категории из уже добавленных айтемов — чтобы не печатать заново.
function categoryOptions(items) {
  const set = new Set();
  (items || []).forEach((i) => {
    const c = i && i.category ? String(i.category).trim() : '';
    if (c) set.add(c);
  });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'ru'));
}

function normalizeItem(raw) {
  const src = raw || {};
  let rating = parseInt(src.rating, 10);
  if (!Number.isFinite(rating)) rating = 0;
  rating = Math.max(0, Math.min(5, rating));
  const str = (v) => (v == null ? null : String(v));
  return {
    id: src.id || newId(),
    title: str(src.title),
    url: str(src.url),
    image_url: str(src.image_url),
    price: str(src.price),
    store: str(src.store),
    rating,
    note: str(src.note),
    category: str(src.category),
    // Подарок уже вручён: остаётся в списке как память, но бронировать его больше не нужно.
    gifted: src.gifted === true || src.gifted === 'true',
    created_at: src.created_at || new Date().toISOString(),
  };
}

function newId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Math.random().toString(36).slice(2);
}

const STORAGE_BUCKET = 'wishlist-images';

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('read error'));
    reader.readAsDataURL(file);
  });
}

/* ===== Адаптер хранилища ===== */
class LocalStore {
  constructor(storage) {
    this.storage = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    this.itemsKey = 'wishlist.items';
    this.resKey = 'wishlist.reservations';
    this.userKey = 'wishlist.user';
  }
  _read(key, def) {
    try {
      const raw = this.storage ? this.storage.getItem(key) : null;
      return raw ? JSON.parse(raw) : def;
    } catch (e) {
      return def;
    }
  }
  _write(key, val) {
    if (this.storage) this.storage.setItem(key, JSON.stringify(val));
  }
  async listItems() {
    return this._read(this.itemsKey, []).map(normalizeItem);
  }
  async saveItem(item) {
    const items = this._read(this.itemsKey, []);
    const norm = normalizeItem(item);
    const idx = items.findIndex((x) => x.id === norm.id);
    if (idx >= 0) items[idx] = norm;
    else items.push(norm);
    this._write(this.itemsKey, items);
    return norm;
  }
  async deleteItem(id) {
    this._write(this.itemsKey, this._read(this.itemsKey, []).filter((x) => x.id !== id));
  }
  async listReservations() {
    return this._read(this.resKey, []);
  }
  async listReservedIds() {
    return this._read(this.resKey, []).map((r) => r.item_id);
  }
  async setReservation(item_id, user_id, name) {
    const list = this._read(this.resKey, []);
    if (list.some((r) => r.item_id === item_id)) return;
    list.push({ item_id, user_id, name });
    this._write(this.resKey, list);
  }
  async clearReservation(item_id) {
    this._write(this.resKey, this._read(this.resKey, []).filter((r) => r.item_id !== item_id));
  }
  async currentUser() {
    return this._read(this.userKey, null);
  }
  async uploadImage(file) {
    return readFileAsDataURL(file);
  }
}

function createStore() {
  if (useSupabase(SUPABASE_CONFIG)) {
    supabaseClient = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);
    return new SupabaseStore(supabaseClient);
  }
  return new LocalStore();
}

/* ===== Supabase ===== */
function useSupabase(cfg) {
  return Boolean(cfg && cfg.url && cfg.key);
}

let supabaseClient = null;

class SupabaseStore {
  constructor(client) {
    this.client = client;
  }
  async listItems() {
    const { data, error } = await this.client.from('items').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    return (data || []).map(normalizeItem);
  }
  async saveItem(item) {
    const norm = normalizeItem(item);
    let { error } = await this.client.from('items').upsert(norm);
    // Колонки gifted может ещё не быть (не выполнен patch-02): не ломаем сохранение айтемов.
    if (error && !norm.gifted && /gifted/i.test(String(error.message || ''))) {
      const payload = Object.assign({}, norm);
      delete payload.gifted;
      ({ error } = await this.client.from('items').upsert(payload));
    }
    if (error) throw error;
    return norm;
  }
  async deleteItem(id) {
    const { error } = await this.client.from('items').delete().eq('id', id);
    if (error) throw error;
  }
  async listReservations() {
    const { data, error } = await this.client.from('reservations').select('item_id,user_id,name');
    if (error) throw error;
    return data || [];
  }
  // Только id забронированных айтемов — RPC отдаёт их лишь админу и без имён.
  async listReservedIds() {
    const { data, error } = await this.client.rpc('reserved_item_ids');
    if (error) return [];
    return (data || []).map((row) => (typeof row === 'string' ? row : row.item_id));
  }
  async setReservation(item_id, user_id, name) {
    const { error } = await this.client.from('reservations').insert({ item_id, user_id, name });
    if (error) throw error;
  }
  async clearReservation(item_id) {
    const { error } = await this.client.from('reservations').delete().eq('item_id', item_id);
    if (error) throw error;
  }
  async currentUser() {
    const { data } = await this.client.auth.getUser();
    const u = data && data.user;
    return u ? { id: u.id, name: displayNameOf(u.email) } : null;
  }
  async uploadImage(file) {
    const ext = String((file && file.name) || '').split('.').pop().toLowerCase() || 'jpg';
    const path = 'items/' + newId() + '.' + ext;
    const { error } = await this.client.storage
      .from(STORAGE_BUCKET)
      .upload(path, file, { contentType: (file && file.type) || 'image/jpeg', upsert: false });
    if (error) throw error;
    const { data } = this.client.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return data.publicUrl;
  }
}

function displayNameOf(email) {
  const s = String(email || '');
  const at = s.indexOf('@');
  return at > 0 ? s.slice(0, at) : s;
}

function describeAuthError(error) {
  if (!error) return '';
  if (error.status === 429 || error.code === 'over_email_send_rate_limit') {
    return 'Превышен лимит отправки писем (у Supabase встроенная почта — пара писем в час). Попробуйте позже или подключите свой SMTP.';
  }
  const msg = String(error.message || '');
  if (/invalid/i.test(msg) && /email|format/i.test(msg)) return 'Проверьте адрес почты';
  return msg || 'Не удалось отправить письмо';
}

function signInWithEmail(email) {
  if (!supabaseClient) return Promise.resolve({});

async function isAdmin(userId) {
  if (!useSupabase(SUPABASE_CONFIG)) return true; // демо-пользователь = админ

  const { data, error } = await supabaseClient

/* ===== Тема ===== */
const THEME_KEY = 'wishlist.theme';

function readTheme(storageLike) {
  let v = null;
  if (storageLike && typeof storageLike.getItem === 'function') v = storageLike.getItem(THEME_KEY);
  else if (storageLike) v = storageLike[THEME_KEY];
  return v === 'light' ? 'light' : 'dark';
}

function applyTheme(theme) {
  const t = theme === 'light' ? 'light' : 'dark';
  if (typeof document !== 'undefined') {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  return t;
}

// Плавная смена темы «волной» от центра кнопки.
// В браузерах без View Transitions тема просто переключается мгновенно.
function switchThemeWithWave(originEl) {
  const cur = typeof document !== 'undefined'
    ? document.documentElement.getAttribute('data-theme')
    : null;
  const next = cur === 'light' ? 'dark' : 'light';

  const canWave =
    typeof document !== 'undefined' &&
    typeof document.startViewTransition === 'function' &&
    !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!canWave) return applyTheme(next);

  let x = window.innerWidth / 2;
  let y = window.innerHeight / 2;
  if (originEl && originEl.getBoundingClientRect) {
    const r = originEl.getBoundingClientRect();
    x = r.left + r.width / 2;
    y = r.top + r.height / 2;
  }
  const radius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));

  const transition = document.startViewTransition(() => applyTheme(next));
  transition.ready
    .then(() => {
      document.documentElement.animate(
        { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)'] },
        { duration: 520, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)', pseudoElement: '::view-transition-new(root)' }
      );
    })
    .catch(() => {});
  return next;
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  return applyTheme(readTheme({ [THEME_KEY]: saved }));
}

function toggleTheme(originEl) {
  return switchThemeWithWave(originEl);
}

/* ===== Рендер ===== */
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'style') Object.assign(node.style, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    }
  }
  (children || []).forEach((c) => {
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

function cardTitle(item) {
  return String((item && item.title) || '').trim();
}

// Цена хранится как свободный текст («2500», «~300»). Показываем её в рублях,
// но не трогаем, если валюта уже указана явно.
function formatPrice(value) {
  const raw = String(value == null ? '' : value).trim();
  if (!raw) return '';
  if (!/\d/.test(raw)) return raw;
  // \b в JS не работает с кириллицей — проверяем валюту явными шаблонами.
  const hasCurrency = /[₽$€£¥]|руб|RUB|USD|EUR|(^|\s)р\.?(\s|$)/i.test(raw);
  if (hasCurrency) return raw;
  return raw + ' ₽';
}

function applyFilters(items, opts) {
  const o = opts || {};
  let out = (items || []).slice();
  if (o.category) out = out.filter((i) => i.category === o.category);
  if (o.query) {
    const q = String(o.query).toLowerCase();
    out = out.filter((i) => String(i.title || '').toLowerCase().indexOf(q) !== -1);
  }
  if (o.sort === 'rating') out.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  else out.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
  return out;
}

function renderStars(rating) {
  const r = Math.max(0, Math.min(5, parseInt(rating, 10) || 0));
  const box = el('div', { class: r === 5 ? 'stars stars-hot' : 'stars', title: r + '/5' });
  for (let i = 1; i <= 5; i++) {
    box.appendChild(el('span', { class: i <= r ? 'star on' : 'star', text: i <= r ? '★' : '☆' }));
  }
  return box;
}

// Правильная форма слова «желание» для счётчика в шапке.
function pluralWishes(n) {
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return 'желаний';
  if (b === 1) return 'желание';
  if (b >= 2 && b <= 4) return 'желания';
  return 'желаний';
}

// «12 желаний · 3 занято · 2 подарено» — сколько всего, забронировано и уже вручено.
function summaryText(items, reservedIds) {
  const list = items || [];
  const total = list.length;
  if (!total) return '';
  const taken = (reservedIds || []).length;
  const gifted = list.filter((i) => i && i.gifted).length;
  let out = total + ' ' + pluralWishes(total);
  if (taken) out += ' · ' + taken + ' занято';
  if (gifted) out += ' · ' + gifted + ' подарено';
  return out;
}

// Клик по звезде i ставит оценку i; клик по уже выбранной — сбрасывает в 0.
function nextRating(current, clicked) {
  const c = Math.max(0, Math.min(5, parseInt(current, 10) || 0));
  const k = Math.max(0, Math.min(5, parseInt(clicked, 10) || 0));
  return c === k ? 0 : k;
}

function renderStarPicker(value, onChange) {
  let current = Math.max(0, Math.min(5, parseInt(value, 10) || 0));
  const box = el('div', { class: 'star-picker' });
  const paint = () => {
    box.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const s = el('span', { class: i <= current ? 'star on' : 'star', text: i <= current ? '★' : '☆' });
      s.addEventListener('click', () => {
        current = nextRating(current, i);
        paint();
        if (onChange) onChange(current);
      });
      box.appendChild(s);
    }
    box.appendChild(el('span', { class: 'star-value', text: current + '/5' }));
  };
  paint();
  return {
    node: box,
    get value() { return current; },
  };
}

function statusBadge(item) {
  return el('span', { class: 'badge', text: statusFromRating(item.rating) });
}

// Заглушки-скелетоны на время загрузки: пользователь видит структуру, а не пустоту.
function renderSkeletons(container, count) {
  if (!container) return;

    body.appendChild(el('div', { class: 'skeleton-line skeleton-tiny' }));

}

/* ===== 3D-наклон карточки ===== */
// Углы наклона из позиции курсора внутри карточки. Центр → 0, край → ±MAX.
const TILT_MAX = 7;

function tiltAngles(x, y, w, h) {
  if (!w || !h) return { rx: 0, ry: 0 };
  const dx = (x / w - 0.5) * 2; // -1..1
  const dy = (y / h - 0.5) * 2;
  return {
    rx: Number((-dy * TILT_MAX).toFixed(2)),
    ry: Number((dx * TILT_MAX).toFixed(2)),
  };
}

// Лёгкий наклон вслед за мышью. Только для устройств с точным курсором:
// на тач-экранах и при отключённых анимациях ничего не навешиваем.
function attachTilt(card) {
  if (!card) return card;
  const noHover =
    typeof window !== 'undefined' &&
    typeof window.matchMedia === 'function' &&
    !window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const reduced =
    typeof window !== 'undefined' &&
    typeof window.matchMedia === 'function' &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (noHover || reduced) return card;

  card.className = (card.className ? card.className + ' ' : '') + 'card-tilt';
  const state = { raf: 0, rx: 0, ry: 0 };
  card._tiltHandlers = state;

  const apply = () => {
    state.raf = 0;
    card.style.transform =
      'translateY(-4px) perspective(900px) rotateX(' + state.rx + 'deg) rotateY(' + state.ry + 'deg)';
  };

  const raf = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : null;
  const caf = typeof cancelAnimationFrame === 'function' ? cancelAnimationFrame : null;

  card.addEventListener('mousemove', (e) => {
    const r = card.getBoundingClientRect();
    const a = tiltAngles(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
    state.rx = a.rx;
    state.ry = a.ry;
    if (raf) {
      if (!state.raf) state.raf = raf(apply);
    } else {
      apply();
    }
  });

  card.addEventListener('mouseleave', () => {
    state.rx = 0;
    state.ry = 0;
    if (caf && state.raf) caf(state.raf);
    state.raf = 0;
    card.style.transform = '';
  });

  return card;
}

/* ===== Брони подарков ===== */
function canSeeReservations(ctx) {
  const c = ctx || {};
  return !c.isAdmin && !!c.user;
}

function reservationLabel(res) {
  return 'Забито: ' + String((res && res.name) || 'кто-то');
}

// Админ не должен знать, кто именно забронировал, но должен видеть сам факт.
function isReservedForAdmin(item, ctx) {
  const c = ctx || {};
  if (!c.isAdmin) return false;
  return (c.reservedIds || []).indexOf(item.id) !== -1;
}

function reservedBadge() {
  return el('span', { class: 'badge badge-reserved', text: 'Забронировано' });
}

function giftedBadge() {
  return el('span', { class: 'badge badge-gifted', text: 'Подарено' });
}

// Отметка «подарено» — только для владельца списка (админа).
async function setGifted(itemId, gifted) {
  const item = (app.items || []).find((i) => i.id === itemId);
  if (!item) return;
  try {
    await app.store.saveItem(Object.assign({}, item, { gifted: !!gifted }));
  } catch (e) {
    /* состояние перечитаем в любом случае */
  }
  closeModal();
  await refresh();
}

function renderGiftedToggle(item) {
  const btn = el('button', {
    class: 'btn btn-sm' + (item.gifted ? '' : ' btn-primary'),
    type: 'button',
    text: item.gifted ? 'Вернуть в список' : 'Уже подарили',
  });
  btn.addEventListener('click', () => setGifted(item.id, !item.gifted));
  return btn;
}

async function reserveItem(itemId, user) {
  try {
    await app.store.setReservation(itemId, user && user.id, (user && user.name) || '');
  } catch (e) {
    /* бронь мог занять кто-то другой — просто перечитаем состояние */
  } finally {
    await refresh();
  }
}

async function cancelReservation(itemId) {
  try {
    await app.store.clearReservation(itemId);
  } catch (e) {
    /* состояние перечитаем в любом случае */
  } finally {
    await refresh();
  }
}

function renderReserve(item, ctx) {
  if (!canSeeReservations(ctx)) return null;
  // Подарок уже вручён — бронировать нечего.
  if (item.gifted) return null;
  const box = el('div', { class: 'reserve' });
  const res = (ctx.reservations || []).find((r) => r.item_id === item.id);
  if (res) {
    box.appendChild(el('span', { class: 'reserve-label', text: reservationLabel(res) }));
    if (ctx.userId && res.user_id === ctx.userId) {
      const cancel = el('button', { class: 'btn btn-sm', type: 'button', text: 'Отменить' });
      cancel.addEventListener('click', () => cancelReservation(item.id));
      box.appendChild(cancel);
    }
  } else {
    const take = el('button', { class: 'btn btn-sm btn-primary', type: 'button', text: 'Я возьму' });
    take.addEventListener('click', () => reserveItem(item.id, ctx.user));
    box.appendChild(take);
  }
  return box;
}

function renderCard(item, ctx) {
  const cls = ['card'];
  if (item.gifted) cls.push('card-gifted');
  else if (isReservedForAdmin(item, ctx)) cls.push('card-reserved');
  if (Number(item.rating) === 5) cls.push('card-hot');
  else if (Number(item.rating) === 4) cls.push('card-warm');
  const card = el('article', { class: cls.join(' ') });

  // Клик по карточке раскрывает её крупно. Кнопки и ссылки внутри не перехватываем.
  const openView = (e) => {
    const t = e && e.target;
    const tag = t && t.tagName ? String(t.tagName).toLowerCase() : '';
    if (tag === 'button' || tag === 'a' || tag === 'input') return;
    openItemView(item, ctx);
  };
  card.addEventListener('click', openView);

  const media = el('div', { class: 'card-media' });
  if (item.image_url) {
    media.appendChild(el('img', { class: 'card-img', src: item.image_url, alt: cardTitle(item), loading: 'lazy' }));
  } else {
    media.appendChild(el('div', { class: 'card-img placeholder', text: 'нет фото' }));
  }
  card.appendChild(media);

  const body = el('div', { class: 'card-body' });
  body.appendChild(el('h3', { class: 'card-title', text: cardTitle(item) || 'Без названия' }));

  const meta = el('div', { class: 'card-meta' });
  if (item.price) meta.appendChild(el('span', { class: 'price', text: formatPrice(item.price) }));
  if (item.store) meta.appendChild(el('span', { class: 'store', text: item.store }));
  body.appendChild(meta);

  body.appendChild(renderStars(item.rating));
  const tags = el('div', { class: 'card-tags' });
  tags.appendChild(statusBadge(item));
  if (item.category) tags.appendChild(el('span', { class: 'tag', text: item.category }));
  if (item.gifted) tags.appendChild(giftedBadge());
  else if (isReservedForAdmin(item, ctx)) tags.appendChild(reservedBadge());
  body.appendChild(tags);

  if (item.note) body.appendChild(el('p', { class: 'note', text: item.note }));
  if (item.url) body.appendChild(el('a', { class: 'card-link', href: item.url, target: '_blank', rel: 'noopener', text: 'Открыть ссылку' }));

  if (ctx && ctx.isAdmin) {
    const actions = el('div', { class: 'card-actions' });
    const editBtn = el('button', { class: 'btn btn-sm', type: 'button', text: 'Изменить' });
    editBtn.addEventListener('click', () => openItemForm(item));
    const delBtn = el('button', { class: 'btn btn-sm btn-danger', type: 'button', text: 'Удалить' });
    delBtn.addEventListener('click', async () => {
      try {
        await app.store.deleteItem(item.id);
      } catch (e) {
        /* перечитаем состояние ниже */
      }
      await refresh();
    });
    actions.append(editBtn, delBtn, renderGiftedToggle(item));
    body.appendChild(actions);
  }

  const reserveBox = renderReserve(item, ctx || {});
  if (reserveBox) body.appendChild(reserveBox);

  card.appendChild(body);
  return card;
}

function renderControls(items, current, onChange) {
  const cur = current || {};
  const bar = el('div', { class: 'controls' });
  const cats = Array.from(new Set((items || []).map((i) => i.category).filter(Boolean)));
  const catSel = el('select', { class: 'control' });
  const allOpt = el('option', { value: '', text: 'Все категории' });
  allOpt.selected = !cur.category;
  catSel.appendChild(allOpt);
  cats.forEach((c) => {
    const o = el('option', { value: c, text: c });
    o.selected = cur.category === c;
    catSel.appendChild(o);
  });

  const sortSel = el('select', { class: 'control' });
  const byDate = el('option', { value: 'date', text: 'Сначала новые' });
  const byRating = el('option', { value: 'rating', text: 'По звёздам' });
  const sort = cur.sort === 'rating' ? 'rating' : 'date';
  byDate.selected = sort === 'date';
  byRating.selected = sort === 'rating';
  sortSel.append(byDate, byRating);

  const search = el('input', { class: 'control', type: 'search', placeholder: 'Поиск по названию…' });
  search.value = cur.query || '';

  const emit = () => onChange({ category: catSel.value || null, sort: sortSel.value, query: search.value || '' });
  catSel.addEventListener('change', emit);
  sortSel.addEventListener('change', emit);
  search.addEventListener('input', emit);

  bar.append(catSel, sortSel, search);
  return bar;
}

function renderList(container, items, ctx) {
  if (!container) return;
  const c = ctx || {};
  const filtered = applyFilters(items || [], c.filter || {});
  container.innerHTML = '';
  if (!filtered.length) {
    container.appendChild(emptyState());
    return;
  }
  filtered.forEach((it, i) => {
    const card = renderCard(it, c);
    // Каскадное появление: каждая следующая карточка чуть позже.
    card.style.animationDelay = Math.min(i * 45, 450) + 'ms';
    container.appendChild(card);
    attachTilt(card);
  });
}

const app = {
  store: createStore(),
  items: [],
  filter: { category: null, sort: 'date', query: '' },
  user: null,
  // В демо-режиме пользователь считается админом; при подключении Supabase
  // значение пересчитывается из profiles.is_admin (Задачи 6–7).
  isAdmin: true,

};

function updateAdminUi() {
  const b = document.getElementById('add-btn');
  if (b) b.style.display = app.isAdmin ? '' : 'none';
}

function renderAuthUi() {
  const slot = document.getElementById('auth-slot');
  if (!slot) return;
  slot.innerHTML = '';
  if (!useSupabase(SUPABASE_CONFIG)) return;
  if (app.user) {
    const name = app.user.name || 'вы вошли';
    const chip = el('span', { class: 'auth-user', title: name });
    chip.appendChild(el('span', { class: 'auth-avatar', text: String(name).slice(0, 1) }));
    chip.appendChild(el('span', { class: 'auth-name', text: name }));
    slot.appendChild(chip);
    const out = el('button', { class: 'btn', type: 'button', text: 'Выйти' });
    out.addEventListener('click', () => signOut());
    slot.appendChild(out);
  } else {
    const email = el('input', { class: 'control', type: 'email', placeholder: 'email для входа' });
    const btn = el('button', { class: 'btn', type: 'button', text: 'Войти' });
    const note = el('span', { class: 'auth-note' });
    btn.addEventListener('click', async () => {
      if (!email.value) return;
      note.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Отправляю…';
      let error = null;
      try {
        const res = await signInWithEmail(email.value.trim());
        error = res && res.error ? res.error : null;
      } catch (e) {
        error = e;
      }
      btn.disabled = false;
      if (error) {
        btn.textContent = 'Войти';
        note.textContent = describeAuthError(error);
      } else {
        btn.textContent = 'Письмо отправлено';
        note.textContent = 'Проверьте почту и папку «Спам».';
      }
    });
    slot.append(email, btn, note);
  }
}

async function resolveAdmin(user) {
  return isAdmin(user && user.id);
}

async function loadSession() {
  app.user = await app.store.currentUser();
  app.isAdmin = await resolveAdmin(app.user);
  renderAuthUi();
  await refresh();
}

function drawList() {
  const listEl = document.getElementById('list');
  renderList(listEl, app.items, {
    isAdmin: app.isAdmin,
    reservations: app.reservations,
    reservedIds: app.reservedIds,
    userId: app.user && app.user.id,
    user: app.user,
    filter: app.filter,
  });
  const sumEl = document.getElementById('summary');
  if (sumEl) {
    // Админ знает занятые только по id (без имён), друг — по обычному списку броней.
    const taken = app.isAdmin
      ? app.reservedIds
      : (app.reservations || []).map((r) => r.item_id);
    sumEl.textContent = summaryText(app.items, taken);
  }
}

async function refresh() {
  // Пока данные идут — показываем скелетоны вместо пустого экрана.
  const listEl = document.getElementById('list');
  if (listEl && !app.items.length) renderSkeletons(listEl, 6);

  app.items = await app.store.listItems();
  app.reservations = await app.store.listReservations();
  app.reservedIds =
    typeof app.store.listReservedIds === 'function' ? (await app.store.listReservedIds()) || [] : [];
  updateAdminUi();
  renderAuthUi();
  const controlsEl = document.getElementById('controls');
  if (controlsEl) {
    controlsEl.innerHTML = '';
    controlsEl.appendChild(
      renderControls(app.items, app.filter, (f) => {
        app.filter = f;
        drawList();
      })
    );
  }
  drawList();
}

/* ===== Парсинг ссылок ===== */
// Устанавливается при подключении Supabase (Задача 6); в демо-режиме остаётся null.
let parseLinkRemote = null;

function domainOf(url) {
  try {
    return new URL(String(url)).hostname.replace(/^www\./, '');
  } catch (e) {
    return '';
  }
}

async function parseLink(url) {
  if (typeof parseLinkRemote === 'function') {
    try {
      const r = await parseLinkRemote(url);
      if (r) {
        return {
          title: r.title || null,
          image_url: r.image_url || null,
          price: r.price || null,
          store: r.store || domainOf(url),
        };
      }
    } catch (e) {
      /* падаем в локальный фолбэк */
    }
  }
  return { title: null, image_url: null, price: null, store: domainOf(url) };
}

/* ===== Форма айтема ===== */
function fieldRow(labelText, value, type, options) {
  const wrap = el('label', { class: 'field' });
  wrap.appendChild(el('span', { class: 'field-label', text: labelText }));
  const input = el(type === 'textarea' ? 'textarea' : 'input', { class: 'field-input' });
  if (type === 'url') input.setAttribute('type', 'url');
  if (type === 'textarea') input.textContent = value == null ? '' : String(value);
  else input.setAttribute('value', value == null ? '' : String(value));
  // Список подсказок (datalist) — для категорий из уже добавленных айтемов.
  if (options && options.length) {
    const listId = 'opts-' + Math.random().toString(36).slice(2, 9);
    const dl = el('datalist', { id: listId });
    options.forEach((o) => dl.appendChild(el('option', { value: o })));
    input.setAttribute('list', listId);
    wrap.appendChild(dl);
  }
  wrap.appendChild(input);
  return { wrap, input };
}

function closeModal() {
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
}

/* ===== Раскрытие карточки: крупный просмотр айтема ===== */
function openItemView(item, ctx) {
  const root = document.getElementById('modal-root');
  if (!root) return;
  const c = ctx || {};
  const it = normalizeItem(item || {});
  root.innerHTML = '';

  const overlay = el('div', { class: 'modal-overlay' });
  const panel = el('div', { class: 'modal view' });

  const close = el('button', { class: 'view-close', type: 'button', text: '×', 'aria-label': 'Закрыть' });
  close.addEventListener('click', closeModal);
  panel.appendChild(close);

  const grid = el('div', { class: it.image_url ? 'view-grid' : 'view-grid single' });

  if (it.image_url) {
    const media = el('div', { class: 'view-media' });
    media.appendChild(el('img', { class: 'view-img', src: it.image_url, alt: cardTitle(it) }));
    grid.appendChild(media);
  }

  const info = el('div', { class: 'view-info' });
  info.appendChild(el('h2', { class: 'view-title', text: cardTitle(it) || 'Без названия' }));

  const meta = el('div', { class: 'view-meta' });
  if (it.price) meta.appendChild(el('span', { class: 'price', text: formatPrice(it.price) }));
  if (it.store) meta.appendChild(el('span', { class: 'store', text: it.store }));
  if (meta.children.length) info.appendChild(meta);

  info.appendChild(renderStars(it.rating));

  const tags = el('div', { class: 'card-tags' });
  tags.appendChild(statusBadge(it));
  if (it.category) tags.appendChild(el('span', { class: 'tag', text: it.category }));
  if (it.gifted) tags.appendChild(giftedBadge());
  else if (isReservedForAdmin(it, c)) tags.appendChild(reservedBadge());
  info.appendChild(tags);

  if (it.note) info.appendChild(el('p', { class: 'view-note', text: it.note }));
  if (it.url) {
    info.appendChild(
      el('a', { class: 'btn btn-primary view-link', href: it.url, target: '_blank', rel: 'noopener', text: 'Открыть в магазине' })
    );
  }

  if (c.isAdmin) info.appendChild(renderGiftedToggle(it));

  const reserveBox = renderReserve(it, c);
  if (reserveBox) info.appendChild(reserveBox);

  grid.appendChild(info);
  panel.appendChild(grid);

  overlay.appendChild(panel);
  // Клик по фону закрывает просмотр (это не форма — вводить нечего).
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });
  root.appendChild(overlay);
}

function openItemForm(item) {
  const root = document.getElementById('modal-root');
  if (!root) return;
  const isEdit = !!item;
  const data = normalizeItem(item || {});
  root.innerHTML = '';

  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal' });
  modal.appendChild(el('h2', { class: 'modal-title', text: isEdit ? 'Редактировать айтем' : 'Новый айтем' }));

  const fUrl = fieldRow('Ссылка', data.url, 'url');
  const fTitle = fieldRow('Название', data.title);

  // Картинка: превью + загрузка файла (в Supabase Storage) + ручная ссылка
  const imageBlock = el('div', { class: 'field' });
  imageBlock.appendChild(el('span', { class: 'field-label', text: 'Картинка' }));
  const preview = el('img', { class: 'image-preview', alt: 'превью' });
  const imageUrlInput = el('input', { class: 'field-input', type: 'url', placeholder: 'ссылка на картинку' });
  imageUrlInput.value = data.image_url || '';
  const syncPreview = () => {
    const v = imageUrlInput.value.trim();
    if (v) {
      preview.setAttribute('src', v);
      preview.style.display = '';
    } else {
      preview.removeAttribute('src');
      preview.style.display = 'none';
    }
  };
  imageUrlInput.addEventListener('input', syncPreview);
  const fileInput = el('input', { class: 'hidden-file', type: 'file', accept: 'image/*' });
  const uploadBtn = el('button', { class: 'btn btn-sm', type: 'button', text: 'Загрузить фото' });
  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    uploadBtn.textContent = 'Загружаю…';
    try {
      const url = await app.store.uploadImage(file);
      imageUrlInput.value = url;
      syncPreview();
      uploadBtn.textContent = 'Загрузить фото';
    } catch (e) {
      uploadBtn.textContent = 'Ошибка загрузки';
    }
  });
  const clearImgBtn = el('button', { class: 'btn btn-sm', type: 'button', text: 'Убрать фото' });
  clearImgBtn.addEventListener('click', () => {
    imageUrlInput.value = '';
    syncPreview();
  });
  imageBlock.appendChild(preview);
  imageBlock.appendChild(el('div', { class: 'image-actions' }, [uploadBtn, clearImgBtn, fileInput]));
  imageBlock.appendChild(imageUrlInput);
  syncPreview();

  const fPrice = fieldRow('Цена, ₽', data.price);
  const fStore = fieldRow('Магазин', data.store);
  const fCategory = fieldRow('Категория', data.category, null, categoryOptions(app.items));
  const ratingPicker = renderStarPicker(data.rating, null);
  const ratingWrap = el('div', { class: 'field' });
  ratingWrap.appendChild(el('span', { class: 'field-label', text: 'Оценка (клик по звезде; повторный клик — сброс)' }));
  ratingWrap.appendChild(ratingPicker.node);
  const fNote = fieldRow('Заметка: почему хочу / зачем / детали', data.note, 'textarea');

  const loadBtn = el('button', { class: 'btn', type: 'button', text: 'Загрузить из ссылки' });
  loadBtn.addEventListener('click', async () => {
    const url = fUrl.input.value.trim();
    if (!url) return;
    loadBtn.textContent = 'Загружаю…';
    const p = await parseLink(url);
    if (p.title && !fTitle.input.value) fTitle.input.value = p.title;
    if (p.image_url && !imageUrlInput.value) { imageUrlInput.value = p.image_url; syncPreview(); }
    if (p.price && !fPrice.input.value) fPrice.input.value = p.price;
    if (p.store && !fStore.input.value) fStore.input.value = p.store;
    loadBtn.textContent = 'Загрузить из ссылки';
  });

  const saveBtn = el('button', { class: 'btn btn-primary', type: 'button', text: 'Сохранить' });
  saveBtn.addEventListener('click', async () => {
    const payload = normalizeItem({
      id: data.id,
      title: fTitle.input.value,
      url: fUrl.input.value,
      image_url: imageUrlInput.value,
      price: fPrice.input.value,
      store: fStore.input.value,
      category: fCategory.input.value,
      rating: ratingPicker.value,
      note: fNote.input.value,
      created_at: data.created_at,
    });
    await app.store.saveItem(payload);
    closeModal();
    await refresh();
  });

  const cancelBtn = el('button', { class: 'btn', type: 'button', text: 'Отмена' });
  cancelBtn.addEventListener('click', closeModal);

  const form = el('div', { class: 'modal-form' });
  form.append(fUrl.wrap, loadBtn, fTitle.wrap, imageBlock, fPrice.wrap, fStore.wrap, fCategory.wrap, ratingWrap, fNote.wrap);
  modal.appendChild(form);
  modal.appendChild(el('div', { class: 'modal-actions' }, [cancelBtn, saveBtn]));
  overlay.appendChild(modal);
  root.appendChild(overlay);
}

/* ===== Тестовый харнесс (мини, без зависимостей) ===== */
let __passed = 0, __failed = 0;

function assertEqual(actual, expected, name) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  const line = (ok ? 'PASS' : 'FAIL') + ' — ' + name;
  if (ok) {
    __passed++;
  } else {
    __failed++;
    console.log('  expected', expected, 'got', actual);
  }
  console.log(line);
  if (typeof document !== 'undefined' && document.getElementById) {
    const out = document.getElementById('test-output');
    if (out) out.textContent += line + '\n';
  }
}

function memoryStorage() {
  const m = new Map();
  return {
    getItem: (k) => (m.has(k) ? m.get(k) : null),
    setItem: (k, v) => { m.set(k, String(v)); },
    removeItem: (k) => { m.delete(k); },
  };
}

// Собирает весь текст из дерева элементов (для проверок в тестах).
function textOf(node) {
  if (!node) return '';
  if (typeof node === 'string') return node;
  let out = node.textContent || '';
  (node.children || []).forEach((c) => { out += ' ' + textOf(c); });
  return out;
}

// Ищет первый элемент с классом cls в дереве (для проверок структуры).
function findByClass(node, cls) {
  if (!node || typeof node === 'string') return null;
  if (String(node.className || '').split(/\s+/).indexOf(cls) !== -1) return node;
  for (const child of node.children || []) {
    const hit = findByClass(child, cls);
    if (hit) return hit;
  }
  return null;
}

async function runTests() {
  __passed = 0;

  assertEqual(statusFromRating(5), 'очень хочу', '5 звёзд → очень хочу');
  assertEqual(statusFromRating(4), 'сильно хочу', '4 звезды → сильно хочу');
  assertEqual(statusFromRating(3), 'хочу', '3 звезды → хочу');
  assertEqual(statusFromRating(1), 'если что', '1 звезда → если что');
  assertEqual(statusFromRating(0), 'без оценки', '0 → без оценки');
  assertEqual(normalizeItem({ title: 'X', rating: 7 }).rating, 5, 'rating > 5 → 5');
  assertEqual(normalizeItem({ title: 'X', rating: '3' }).rating, 3, 'rating из строки');
  assertEqual(normalizeItem({ title: 'X', rating: 0 }).rating, 0, 'rating 0 сохраняется');
  assertEqual(normalizeItem({ title: 'X' }).title, 'X', 'title сохраняется');

  const s = new LocalStore(memoryStorage());
  await s.saveItem({ title: 'A' });
  assertEqual((await s.listItems()).length, 1, 'saveItem добавляет');
  const a = (await s.listItems())[0];
  await s.saveItem({ ...a, title: 'A2' });
  assertEqual((await s.listItems()).length, 1, 'saveItem обновляет по id');
  await s.deleteItem(a.id);
  assertEqual((await s.listItems()).length, 0, 'deleteItem удаляет');

  assertEqual(readTheme({}), 'dark', 'дефолт — тёмная');
  assertEqual(readTheme({ 'wishlist.theme': 'light' }), 'light', 'читает сохранённую');

  assertEqual(cardTitle({ title: '  X  ' }), 'X', 'trim названия');
  assertEqual(textOf(emptyState()).trim().length > 0, true, 'пустое состояние непустое');
  const src = [{ title: 'A', rating: 2, category: 'g' }, { title: 'B', rating: 5, category: 'b' }];
  assertEqual(applyFilters(src, { sort: 'rating' })[0].title, 'B', 'сортировка по звёздам');
  assertEqual(applyFilters(src, { category: 'g' }).length, 1, 'фильтр по категории');
  assertEqual(applyFilters(src, { query: 'a' })[0].title, 'A', 'поиск по названию');

  assertEqual(domainOf('https://www.ozon.ru/product/1'), 'ozon.ru', 'домен без www');
  assertEqual(domainOf('not a url'), '', 'невалидный URL → пусто');
  assertEqual(domainOf('http://sub.shop.io/x'), 'sub.shop.io', 'поддомен сохраняется');
  assertEqual(normalizeItem({ title: null, price: '1 299 ₽' }).price, '1 299 ₽', 'цена как текст');

  // Цена показывается в рублях
  assertEqual(formatPrice('2500'), '2500 ₽', 'число → рубли');
  assertEqual(formatPrice('1 299'), '1 299 ₽', 'число с пробелом → рубли');
  assertEqual(formatPrice('~300'), '~300 ₽', 'примерная цена → рубли');
  assertEqual(formatPrice('2500 ₽'), '2500 ₽', 'не дублирует знак рубля');
  assertEqual(formatPrice('2500 руб.'), '2500 руб.', 'не дублирует «руб.»');
  assertEqual(formatPrice('$20'), '$20', 'доллар не переделываем в рубли');
  assertEqual(formatPrice(''), '', 'пустая цена → пусто');
  assertEqual(formatPrice(null), '', 'null → пусто');
  assertEqual(formatPrice('дорого'), 'дорого', 'текст без цифр не трогаем');
  const priceCard = renderCard({ title: 'X', price: '2500' }, { isAdmin: false, reservations: [] });
  assertEqual(priceCard.children[1].children[1].children[0].textContent, '2500 ₽', 'в карточке цена с рублём');
  assertEqual((await parseLink('https://shop.io/x')).store, 'shop.io', 'сбой парсинга → домен как магазин');

  assertEqual(useSupabase({ url: '', key: '' }), false, 'пустые ключи → демо');
  assertEqual(useSupabase({ url: 'u', key: 'k' }), true, 'ключи есть → Supabase');

  // Понятные сообщения вместо молчаливого «письмо отправлено»
  assertEqual(describeAuthError(null), '', 'нет ошибки → пусто');
  assertEqual(
    describeAuthError({ status: 429, code: 'over_email_send_rate_limit' }).indexOf('лимит') !== -1,
    true,
    'лимит отправки объясняется'
  );
  assertEqual(
    describeAuthError({ status: 400, message: 'Email address is invalid' }),
    'Проверьте адрес почты',
    'неверный email объясняется'
  );

  assertEqual(
    document.getElementById('test-output').textContent.indexOf('PASS') !== -1,
    true,
    'результат тестов виден на странице'
  );

  assertEqual(canSeeReservations({ isAdmin: true, user: { id: 'a' } }), false, 'админ не видит брони');
  assertEqual(canSeeReservations({ isAdmin: false, user: null }), false, 'аноним не видит брони');
  assertEqual(canSeeReservations({ isAdmin: false, user: { id: 'b' } }), true, 'друг видит брони');

  // Админ видит факт брони (но не имя)
  const adminCardFree = renderCard(
    { id: 'i1', title: 'Свободный' },
    { isAdmin: true, reservations: [], reservedIds: [] }
  );
  assertEqual(textOf(adminCardFree).indexOf('Забронировано') === -1, true, 'админ: свободный айтем без метки');
  const adminCardTaken = renderCard(
    { id: 'i2', title: 'Занятый' },
    { isAdmin: true, reservations: [], reservedIds: ['i2'] }
  );
  assertEqual(textOf(adminCardTaken).indexOf('Забронировано') !== -1, true, 'админ видит, что айтем забронирован');
  assertEqual(textOf(adminCardTaken).indexOf('Забито') === -1, true, 'админ не видит имя бронирующего');
  const friendCardTaken = renderCard(
    { id: 'i3', title: 'X' },
    { isAdmin: false, user: { id: 'u1' }, userId: 'u1', reservations: [{ item_id: 'i3', user_id: 'u2', name: 'Ann' }] }
  );
  assertEqual(textOf(friendCardTaken).indexOf('Забито: Ann') !== -1, true, 'друг видит имя брони');

  // Счётчик в шапке
  assertEqual(summaryText([], []), '', 'пустой список → нет счётчика');
  assertEqual(summaryText([{ id: 'a' }], []), '1 желание', 'одно желание');
  assertEqual(summaryText([{ id: 'a' }, { id: 'b' }], []), '2 желания', 'два желания');
  assertEqual(summaryText([{ id: 'a' }, { id: 'b' }, { id: 'c' }], []), '3 желания', 'три желания');
  assertEqual(
    summaryText([{ id: 'a' }, { id: 'b' }, { id: 'c' }, { id: 'd' }, { id: 'e' }], []),
    '5 желаний',
    'пять желаний'
  );
  assertEqual(
    summaryText([{ id: 'a' }, { id: 'b' }], ['a']),
    '2 желания · 1 занято',
    'счётчик учитывает занятые'
  );
  assertEqual(
    summaryText([{ id: 'a' }, { id: 'b' }, { id: 'c' }], ['a', 'b']),
    '3 желания · 2 занято',
    'несколько занятых'
  );

  // Пять звёзд визуально выделяются
  const hotCard = renderCard({ id: 'h', title: 'Мечта', rating: 5 }, { isAdmin: false });
  assertEqual(hotCard.className.indexOf('card-hot') !== -1, true, '5 звёзд → карточка выделена');
  const coolCard = renderCard({ id: 'c', title: 'Так', rating: 3 }, { isAdmin: false });
  assertEqual(coolCard.className.indexOf('card-hot') === -1, true, '3 звезды → без выделения');
  assertEqual(renderStars(5).className.indexOf('stars-hot') !== -1, true, '5 звёзд → звёзды подсвечены');

  // Скелетоны при загрузке
  const skelBox = document.createElement('div');
  renderSkeletons(skelBox, 3);
  assertEqual(skelBox.children.length, 3, 'скелетоны: три заглушки');
  assertEqual(skelBox.children[0].className.indexOf('skeleton-card') !== -1, true, 'скелетон: класс карточки');
  assertEqual(skelBox.children[0].children.length >= 2, true, 'скелетон: есть блоки картинки и текста');

  // Пустое состояние с SVG
  const empty = emptyState();
  assertEqual(empty.className.indexOf('empty') !== -1, true, 'пустое состояние: класс empty');
  assertEqual(empty.children[0].innerHTML.indexOf('<svg') !== -1, true, 'пустое состояние: SVG-иллюстрация');
  assertEqual(textOf(empty).indexOf('пусто') !== -1, true, 'пустое состояние: есть текст');

  // 3D-наклон карточки
  const tiltCard = el('article', { class: 'card' });
  assertEqual(typeof attachTilt, 'function', 'attachTilt определён');
  attachTilt(tiltCard);
  assertEqual(tiltCard.className.indexOf('card-tilt') !== -1, true, 'карточка помечена как наклоняемая');
  assertEqual(typeof tiltCard._tiltHandlers === 'object', true, 'обработчики наклона навешены');
  // Наклон считается из позиции курсора
  assertEqual(tiltAngles(0, 0, 100, 100).rx > 0, true, 'верхний левый угол → наклон по X');
  assertEqual(tiltAngles(50, 50, 100, 100).rx, 0, 'центр → без наклона по X');
  assertEqual(tiltAngles(50, 50, 100, 100).ry, 0, 'центр → без наклона по Y');
  assertEqual(tiltAngles(100, 50, 100, 100).ry > 0, true, 'правый край → наклон по Y');
  assertEqual(tiltAngles(50, 50, 0, 0).rx, 0, 'нулевой размер → без наклона');

  // Категории из уже добавленных айтемов
  assertEqual(categoryOptions([]), [], 'нет айтемов → нет категорий');
  assertEqual(
    categoryOptions([{ category: 'Техника' }, { category: 'Книги' }, { category: 'Техника' }]),
    ['Книги', 'Техника'],
    'категории без дублей, по алфавиту'
  );
  assertEqual(
    categoryOptions([{ category: 'Техника' }, { category: '  ' }, { category: null }, { title: 'x' }]),
    ['Техника'],
    'пустые категории отбрасываются'
  );

  // Раскрытие карточки
  const viewRoot = document.getElementById('modal-root');
  viewRoot.innerHTML = '';
  openItemView({ id: 'v1', title: 'Подарок', rating: 5, price: '1000', note: 'очень надо' });
  assertEqual(viewRoot.children.length, 1, 'раскрытие: окно открылось');
  assertEqual(textOf(viewRoot).indexOf('Подарок') !== -1, true, 'раскрытие: название внутри');
  assertEqual(textOf(viewRoot).indexOf('очень надо') !== -1, true, 'раскрытие: заметка внутри');
  assertEqual(textOf(viewRoot).indexOf('1000 ₽') !== -1, true, 'раскрытие: цена в рублях');
  closeModal();
  assertEqual(viewRoot.children.length, 0, 'раскрытие: закрывается');

  // Раскрытие: картинка и текст в отдельных блоках (иначе высокая картинка обрезается)
  viewRoot.innerHTML = '';
  openItemView({ id: 'v2', title: 'С картинкой', image_url: 'https://x/y.png', note: 'n' });
  const viewPanel = viewRoot.children[0].children[0];
  const viewGrid = findByClass(viewPanel, 'view-grid');
  assertEqual(viewGrid !== null, true, 'просмотр: есть сетка');
  assertEqual(findByClass(viewGrid, 'view-media') !== null, true, 'просмотр: блок картинки');
  assertEqual(findByClass(viewGrid, 'view-info') !== null, true, 'просмотр: блок описания');
  const viewInfo = findByClass(viewGrid, 'view-info');
  assertEqual(textOf(viewInfo).indexOf('С картинкой') !== -1, true, 'просмотр: текст в блоке описания');
  assertEqual(findByClass(viewInfo, 'view-img'), null, 'просмотр: картинка не в блоке описания');
  closeModal();

  // Без картинки блок описания занимает всё окно
  viewRoot.innerHTML = '';
  openItemView({ id: 'v3', title: 'Без фото' });
  const noImgGrid = findByClass(viewRoot.children[0].children[0], 'view-grid');
  assertEqual(findByClass(noImgGrid, 'view-media'), null, 'просмотр: без картинки нет блока картинки');
  assertEqual(findByClass(noImgGrid, 'view-info') !== null, true, 'просмотр: без картинки описание на месте');
  closeModal();

  // Подаренные подарки
  assertEqual(normalizeItem({ id: 'g1', gifted: true }).gifted, true, 'подарено: true читается');
  assertEqual(normalizeItem({ id: 'g2' }).gifted, false, 'подарено: по умолчанию false');
  assertEqual(
    summaryText([{ id: 'a', gifted: true }, { id: 'b' }], []),
    '2 желания · 1 подарено',
    'счётчик: подарено'
  );
  assertEqual(
    summaryText([{ id: 'a', gifted: true }], ['b']),
    '1 желание · 1 занято · 1 подарено',
    'счётчик: занято и подарено вместе'
  );

  const giftedCard = renderCard({ id: 'g3', title: 'G', gifted: true }, { isAdmin: true });
  assertEqual(findByClass(giftedCard, 'badge-gifted') !== null, true, 'подаренный: метка на карточке');
  assertEqual(textOf(giftedCard).indexOf('Подарено') !== -1, true, 'подаренный: текст метки');
  assertEqual(giftedCard.className.indexOf('card-gifted') !== -1, true, 'подаренный: класс карточки');
  assertEqual(textOf(giftedCard).indexOf('Уже подарили') === -1, true, 'подаренный: кнопка «вернуть»');
  assertEqual(textOf(giftedCard).indexOf('Вернуть в список') !== -1, true, 'подаренный: текст возврата');

  const plainCard = renderCard({ id: 'g4', title: 'P' }, { isAdmin: true });
  assertEqual(textOf(plainCard).indexOf('Уже подарили') !== -1, true, 'обычный: можно отметить подаренным');
  assertEqual(findByClass(plainCard, 'badge-gifted'), null, 'обычный: метки нет');

  const guestCard = renderCard({ id: 'g5', title: 'P' }, { isAdmin: false });
  assertEqual(textOf(guestCard).indexOf('Уже подарили') === -1, true, 'гость: отметки нет');
  assertEqual(
    renderReserve({ id: 'g6', gifted: true }, { user: { id: 'u1' } }),
    null,
    'подаренный: бронь не предлагается'
  );

  const gs = new LocalStore(memoryStorage());
  await gs.saveItem({ id: 'g7', title: 'Gift', gifted: true });
  assertEqual((await gs.listItems())[0].gifted, true, 'подарено: сохраняется в хранилище');

  // В просмотре подаренного — метка и кнопка возврата
  viewRoot.innerHTML = '';
  openItemView({ id: 'g8', title: 'Подарок', gifted: true }, { isAdmin: true });
  assertEqual(textOf(viewRoot).indexOf('Подарено') !== -1, true, 'просмотр: метка «Подарено»');
  assertEqual(textOf(viewRoot).indexOf('Вернуть в список') !== -1, true, 'просмотр: кнопка возврата');
  closeModal();

  // Уровни свечения: 5 ярче 4
  assertEqual(renderCard({ id: 'a', title: 'A', rating: 5 }, {}).className.indexOf('card-hot') !== -1, true, '5 → card-hot');
  assertEqual(renderCard({ id: 'b', title: 'B', rating: 4 }, {}).className.indexOf('card-warm') !== -1, true, '4 → card-warm');
  assertEqual(renderCard({ id: 'c', title: 'C', rating: 3 }, {}).className.indexOf('card-warm') === -1, true, '3 → без свечения');
  assertEqual(reservationLabel({ name: 'Ann' }), 'Забито: Ann', 'метка брони');
  const s2 = new LocalStore(memoryStorage());
  await s2.setReservation('i1', 'u1', 'Ann');
  await s2.setReservation('i1', 'u2', 'Bob');
  assertEqual((await s2.listReservations())[0].name, 'Ann', 'повторная бронь не перезаписывает');

  // Демо-сценарий: друг забивает подарок (в изолированном хранилище)
  const demoStore = new LocalStore(memoryStorage());
  const origAppStore = app.store;
  app.store = demoStore;
  await app.store.saveItem({ title: 'Demo' });
  const demoItem = (await app.store.listItems()).find((i) => i.title === 'Demo');
  await reserveItem(demoItem.id, { id: 'friend-1', name: 'Friend' });
  const reserved = (await app.store.listReservations()).find((x) => x.item_id === demoItem.id);
  assertEqual(reserved && reserved.name, 'Friend', 'друг забил подарок (демо)');
  app.store = origAppStore;

  // Финальное ревью: исправления
  assertEqual(displayNameOf('ann@example.com'), 'ann', 'имя из email');
  assertEqual(displayNameOf(''), '', 'пустой email → пусто');

  const ctr = renderControls([{ category: 'g' }], { category: 'g', sort: 'rating', query: 'x' }, () => {});
  assertEqual(ctr.children[0].children[1].selected, true, 'фильтр категории сохраняется');
  assertEqual(ctr.children[1].children[1].selected, true, 'сортировка сохраняется');
  assertEqual(ctr.children[2].value, 'x', 'поиск сохраняется');

  const origStore = app.store;
  app.store = {
    listItems: async () => [],
    listReservations: async () => [],
    setReservation: async () => {
      throw new Error('duplicate');
    },
    clearReservation: async () => {
      throw new Error('boom');
    },
  };
  let threw = false;
  try {
    await reserveItem('x', { id: 'u', name: 'n' });
    await cancelReservation('x');
  } catch (e) {
    threw = true;
  }
  assertEqual(threw, false, 'ошибка брони не пробрасывается наружу');
  app.store = origStore;

  // Оценка звёздами
  assertEqual(nextRating(3, 4), 4, 'клик по другой звезде ставит её');
  assertEqual(nextRating(3, 3), 0, 'клик по текущей сбрасывает в 0');
  assertEqual(nextRating(0, 5), 5, 'из 0 в 5');
  let picked = -1;
  const picker = renderStarPicker(3, (v) => { picked = v; });
  assertEqual(picker.node.children.length, 6, '5 звёзд + подпись');
  picker.node.children[3].click();
  assertEqual(picker.value, 4, 'клик по звезде в форме ставит оценку');
  assertEqual(picked, 4, 'onChange получает новую оценку');

  // Окно создания не закрывается кликом по затемнённому фону
  openItemForm(null);
  const modalRoot = document.getElementById('modal-root');
  const overlayEl = modalRoot.children[0];
  overlayEl.dispatch('click', { target: overlayEl });
  assertEqual(modalRoot.children.length, 1, 'клик по фону не закрывает форму');
  closeModal();

  // Загрузка картинки
  const s3 = new LocalStore(memoryStorage());
  const up = await s3.uploadImage({ name: 'a.png', type: 'image/png' });
  assertEqual(typeof up === 'string' && up.indexOf('data:') === 0, true, 'uploadImage в демо → data-URL');

  // Тесты не должны трогать общий localStorage
  assertEqual(localStorage.getItem('wishlist.items'), null, 'тесты не пишут айтемы в общий localStorage');
  assertEqual(localStorage.getItem('wishlist.reservations'), null, 'тесты не пишут брони в общий localStorage');

  return { passed: __passed, failed: __failed };
}

/* Автозапуск в браузере при ?test=1 */
if (typeof location !== 'undefined' && location.search.indexOf('test=1') !== -1) {
  if (typeof document !== 'undefined' && document.getElementById) {
    const out = document.getElementById('test-output');
    if (out) out.style.display = 'block';
  }
  runTests();
}

/* ===== Bootstrap (только браузер) ===== */
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('DOMContentLoaded', async () => {
    initTheme();
    const tt = document.getElementById('theme-toggle');
    if (tt) tt.addEventListener('click', () => toggleTheme(tt));
    const addBtn = document.getElementById('add-btn');
    if (addBtn) addBtn.addEventListener('click', () => openItemForm(null));
    initSupabase();
    onAuthChange(() => loadSession());
    await loadSession();
  });
}
</script>
</body>
</html>
