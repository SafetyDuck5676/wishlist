<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wishlist</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232d;
    --text: #e6edf3;
    --muted: #8b98a5;
    --border: #2a323d;
    --accent: #f5a623;
    --accent-soft: rgba(245, 166, 35, 0.15);
    --danger: #f0616d;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --text: #1a2028;
    --muted: #667180;
    --border: #e0e4ea;
    --accent: #e08b00;
    --accent-soft: rgba(224, 139, 0, 0.12);
    --danger: #d33b48;
    --shadow: 0 6px 20px rgba(20, 30, 45, 0.12);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .topbar h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #1a1200;
    border-color: var(--accent);
    font-weight: 600;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 22px 20px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .control {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.9rem;
  }
  .control[type="search"] { flex: 1 1 180px; min-width: 160px; }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, border-color 0.2s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card-media { aspect-ratio: 4 / 3; background: var(--panel-2); overflow: hidden; }
  .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-img.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .card-title { margin: 0; font-size: 1rem; line-height: 1.3; }
  .card-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.95rem; }
  .price { font-weight: 700; color: var(--accent); }
  .store { color: var(--muted); font-size: 0.85rem; }
  .stars { letter-spacing: 2px; color: var(--muted); font-size: 1.05rem; }
  .star.on { color: var(--accent); }
  .star-picker { display: flex; align-items: center; gap: 2px; font-size: 1.5rem; letter-spacing: 2px; }
  .star-picker .star { cursor: pointer; color: var(--muted); user-select: none; transition: color 0.15s ease, transform 0.1s ease; }
  .star-picker .star:hover { transform: scale(1.15); }
  .star-picker .star.on { color: var(--accent); }
  .star-value { margin-left: 8px; font-size: 0.85rem; color: var(--muted); }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 0.75rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid transparent;
  }
  .tag {
    font-size: 0.75rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .note { margin: 0; font-size: 0.9rem; color: var(--text); opacity: 0.9; white-space: pre-wrap; }
  .card-link { color: var(--accent); font-size: 0.85rem; text-decoration: none; }
  .card-link:hover { text-decoration: underline; }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 48px 16px;
    border: 1px dashed var(--border);
    border-radius: 14px;
  }
  #test-output {
    display: none;
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 20px 40px;
    white-space: pre-wrap;
    font-family: "Consolas", "SFMono-Regular", monospace;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow: auto;
    z-index: 50;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 520px;
    padding: 22px;
  }
  .modal-title { margin: 0 0 14px; font-size: 1.15rem; }
  .modal-form { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 0.8rem; color: var(--muted); }
  .field-input {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 0.92rem;
    font-family: inherit;
    width: 100%;
  }
  textarea.field-input { min-height: 84px; resize: vertical; }
  .field-input:focus { outline: none; border-color: var(--accent); }
  .image-preview {
    width: 100%;
    max-height: 200px;
    object-fit: contain;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .image-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .hidden-file { display: none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .card-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-sm { padding: 5px 10px; font-size: 0.8rem; border-radius: 8px; }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .auth-user { color: var(--muted); font-size: 0.85rem; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auth-note { color: var(--danger); font-size: 0.78rem; max-width: 260px; line-height: 1.3; }
  .reserve { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
  .reserve-label { font-size: 0.82rem; color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header class="topbar">
  <h1>Вишлист</h1>
  <div class="topbar-actions">
    <button id="add-btn" class="btn btn-primary" type="button">Добавить</button>
    <span id="auth-slot"></span>
    <button id="theme-toggle" class="btn" type="button">Тема</button>
  </div>
</header>
<main class="wrap">
  <div id="controls"></div>
  <div id="list" class="grid"></div>
</main>
<div id="modal-root"></div>
<div id="test-output"></div>
<script id="app">
/* ===== Конфигурация Supabase =====
   url — Project URL вида https://<project-ref>.supabase.co (НЕ адрес панели
   dashboard.supabase.com).
   key — publishable key (sb_publishable_...) из Project Settings → API Keys.
   В старом интерфейсе он назывался anon public и выглядел как длинная строка
   eyJ... — тоже подходит. Ключ secret / service_role сюда вставлять НЕЛЬЗЯ:
   он обходит все правила доступа.
   Пока key пустой — приложение работает в демо-режиме на localStorage. */
const SUPABASE_CONFIG = {
  url: 'https://lnafryewimjvcupuoczp.supabase.co',
  key: 'sb_publishable_1wkK0B5U22QOhP5lylM0hQ_hLUumoca',
};

/* ===== Модель айтема ===== */
function statusFromRating(rating) {
  const r = Math.max(0, Math.min(5, parseInt(rating, 10) || 0));
  if (r === 5) return 'очень хочу';
  if (r >= 3) return 'хочу';
  if (r >= 1) return 'если что';
  return 'без оценки';
}

function normalizeItem(raw) {
  const src = raw || {};
  let rating = parseInt(src.rating, 10);
  if (!Number.isFinite(rating)) rating = 0;
  rating = Math.max(0, Math.min(5, rating));
  const str = (v) => (v == null ? null : String(v));
  return {
    id: src.id || newId(),
    title: str(src.title),
    url: str(src.url),
    image_url: str(src.image_url),
    price: str(src.price),
    store: str(src.store),
    rating,
    note: str(src.note),
    category: str(src.category),
    created_at: src.created_at || new Date().toISOString(),
  };
}

function newId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Math.random().toString(36).slice(2);
}

const STORAGE_BUCKET = 'wishlist-images';

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('read error'));
    reader.readAsDataURL(file);
  });
}

/* ===== Адаптер хранилища ===== */
class LocalStore {
  constructor(storage) {
    this.storage = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    this.itemsKey = 'wishlist.items';
    this.resKey = 'wishlist.reservations';
    this.userKey = 'wishlist.user';
  }
  _read(key, def) {
    try {
      const raw = this.storage ? this.storage.getItem(key) : null;
      return raw ? JSON.parse(raw) : def;
    } catch (e) {
      return def;
    }
  }
  _write(key, val) {
    if (this.storage) this.storage.setItem(key, JSON.stringify(val));
  }
  async listItems() {
    return this._read(this.itemsKey, []).map(normalizeItem);
  }
  async saveItem(item) {
    const items = this._read(this.itemsKey, []);
    const norm = normalizeItem(item);
    const idx = items.findIndex((x) => x.id === norm.id);
    if (idx >= 0) items[idx] = norm;
    else items.push(norm);
    this._write(this.itemsKey, items);
    return norm;
  }
  async deleteItem(id) {
    this._write(this.itemsKey, this._read(this.itemsKey, []).filter((x) => x.id !== id));
  }
  async listReservations() {
    return this._read(this.resKey, []);
  }
  async setReservation(item_id, user_id, name) {
    const list = this._read(this.resKey, []);
    if (list.some((r) => r.item_id === item_id)) return;
    list.push({ item_id, user_id, name });
    this._write(this.resKey, list);
  }
  async clearReservation(item_id) {
    this._write(this.resKey, this._read(this.resKey, []).filter((r) => r.item_id !== item_id));
  }
  async currentUser() {
    return this._read(this.userKey, null);
  }
  async uploadImage(file) {
    return readFileAsDataURL(file);
  }
}

function createStore() {
  if (useSupabase(SUPABASE_CONFIG)) {
    supabaseClient = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);
    return new SupabaseStore(supabaseClient);
  }
  return new LocalStore();
}

/* ===== Supabase ===== */
function useSupabase(cfg) {
  return Boolean(cfg && cfg.url && cfg.key);
}

let supabaseClient = null;

class SupabaseStore {
  constructor(client) {
    this.client = client;
  }
  async listItems() {
    const { data, error } = await this.client.from('items').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    return (data || []).map(normalizeItem);
  }
  async saveItem(item) {
    const norm = normalizeItem(item);
    const { error } = await this.client.from('items').upsert(norm);
    if (error) throw error;
    return norm;
  }
  async deleteItem(id) {
    const { error } = await this.client.from('items').delete().eq('id', id);
    if (error) throw error;
  }
  async listReservations() {
    const { data, error } = await this.client.from('reservations').select('item_id,user_id,name');
    if (error) throw error;
    return data || [];
  }
  async setReservation(item_id, user_id, name) {
    const { error } = await this.client.from('reservations').insert({ item_id, user_id, name });
    if (error) throw error;
  }
  async clearReservation(item_id) {
    const { error } = await this.client.from('reservations').delete().eq('item_id', item_id);
    if (error) throw error;
  }
  async currentUser() {
    const { data } = await this.client.auth.getUser();
    const u = data && data.user;
    return u ? { id: u.id, name: displayNameOf(u.email) } : null;
  }
  async uploadImage(file) {
    const ext = String((file && file.name) || '').split('.').pop().toLowerCase() || 'jpg';
    const path = 'items/' + newId() + '.' + ext;
    const { error } = await this.client.storage
      .from(STORAGE_BUCKET)
      .upload(path, file, { contentType: (file && file.type) || 'image/jpeg', upsert: false });
    if (error) throw error;
    const { data } = this.client.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return data.publicUrl;
  }
}

function displayNameOf(email) {
  const s = String(email || '');
  const at = s.indexOf('@');
  return at > 0 ? s.slice(0, at) : s;
}

function describeAuthError(error) {
  if (!error) return '';
  if (error.status === 429 || error.code === 'over_email_send_rate_limit') {
    return 'Превышен лимит отправки писем (у Supabase встроенная почта — пара писем в час). Попробуйте позже или подключите свой SMTP.';
  }
  const msg = String(error.message || '');
  if (/invalid/i.test(msg) && /email|format/i.test(msg)) return 'Проверьте адрес почты';
  return msg || 'Не удалось отправить письмо';
}

function signInWithEmail(email) {
  if (!supabaseClient) return Promise.resolve({});
  const redirectTo = typeof location !== 'undefined' ? location.origin + location.pathname : undefined;
  return supabaseClient.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } });
}

function signOut() {
  return supabaseClient ? supabaseClient.auth.signOut() : Promise.resolve();
}

function onAuthChange(cb) {
  if (!supabaseClient) return;
  supabaseClient.auth.onAuthStateChange((_event, session) => cb(session));
}

function initSupabase() {
  if (!supabaseClient) return null;
  parseLinkRemote = async (url) => {
    const { data, error } = await supabaseClient.functions.invoke('parse-link', { body: { url } });
    if (error) throw error;
    return data;
  };
  return supabaseClient;
}

async function isAdmin(userId) {
  if (!useSupabase(SUPABASE_CONFIG)) return true; // демо-пользователь = админ
  if (!userId || !supabaseClient) return false;
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('is_admin')
    .eq('user_id', userId)
    .maybeSingle();
  if (error) return false;
  return Boolean(data && data.is_admin);
}

/* ===== Тема ===== */
const THEME_KEY = 'wishlist.theme';

function readTheme(storageLike) {
  let v = null;
  if (storageLike && typeof storageLike.getItem === 'function') v = storageLike.getItem(THEME_KEY);
  else if (storageLike) v = storageLike[THEME_KEY];
  return v === 'light' ? 'light' : 'dark';
}

function applyTheme(theme) {
  const t = theme === 'light' ? 'light' : 'dark';
  if (typeof document !== 'undefined') {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  return t;
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  return applyTheme(readTheme({ [THEME_KEY]: saved }));
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  return applyTheme(cur === 'light' ? 'dark' : 'light');
}

/* ===== Рендер ===== */
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'style') Object.assign(node.style, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    }
  }
  (children || []).forEach((c) => {
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

function cardTitle(item) {
  return String((item && item.title) || '').trim();
}

// Цена хранится как свободный текст («2500», «~300»). Показываем её в рублях,
// но не трогаем, если валюта уже указана явно.
function formatPrice(value) {
  const raw = String(value == null ? '' : value).trim();
  if (!raw) return '';
  if (!/\d/.test(raw)) return raw;
  // \b в JS не работает с кириллицей — проверяем валюту явными шаблонами.
  const hasCurrency = /[₽$€£¥]|руб|RUB|USD|EUR|(^|\s)р\.?(\s|$)/i.test(raw);
  if (hasCurrency) return raw;
  return raw + ' ₽';
}

function applyFilters(items, opts) {
  const o = opts || {};
  let out = (items || []).slice();
  if (o.category) out = out.filter((i) => i.category === o.category);
  if (o.query) {
    const q = String(o.query).toLowerCase();
    out = out.filter((i) => String(i.title || '').toLowerCase().indexOf(q) !== -1);
  }
  if (o.sort === 'rating') out.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  else out.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
  return out;
}

function renderStars(rating) {
  const r = Math.max(0, Math.min(5, parseInt(rating, 10) || 0));
  const box = el('div', { class: 'stars', title: r + '/5' });
  for (let i = 1; i <= 5; i++) {
    box.appendChild(el('span', { class: i <= r ? 'star on' : 'star', text: i <= r ? '★' : '☆' }));
  }
  return box;
}

// Клик по звезде i ставит оценку i; клик по уже выбранной — сбрасывает в 0.
function nextRating(current, clicked) {
  const c = Math.max(0, Math.min(5, parseInt(current, 10) || 0));
  const k = Math.max(0, Math.min(5, parseInt(clicked, 10) || 0));
  return c === k ? 0 : k;
}

function renderStarPicker(value, onChange) {
  let current = Math.max(0, Math.min(5, parseInt(value, 10) || 0));
  const box = el('div', { class: 'star-picker' });
  const paint = () => {
    box.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const s = el('span', { class: i <= current ? 'star on' : 'star', text: i <= current ? '★' : '☆' });
      s.addEventListener('click', () => {
        current = nextRating(current, i);
        paint();
        if (onChange) onChange(current);
      });
      box.appendChild(s);
    }
    box.appendChild(el('span', { class: 'star-value', text: current + '/5' }));
  };
  paint();
  return {
    node: box,
    get value() { return current; },
  };
}

function statusBadge(item) {
  return el('span', { class: 'badge', text: statusFromRating(item.rating) });
}

function emptyState() {
  return el('div', { class: 'empty', text: 'Пока пусто. Добавь первый айтем — вставь ссылку или заполни вручную.' });
}

/* ===== Брони подарков ===== */
function canSeeReservations(ctx) {
  const c = ctx || {};
  return !c.isAdmin && !!c.user;
}

function reservationLabel(res) {
  return 'Забито: ' + String((res && res.name) || 'кто-то');
}

async function reserveItem(itemId, user) {
  try {
    await app.store.setReservation(itemId, user && user.id, (user && user.name) || '');
  } catch (e) {
    /* бронь мог занять кто-то другой — просто перечитаем состояние */
  } finally {
    await refresh();
  }
}

async function cancelReservation(itemId) {
  try {
    await app.store.clearReservation(itemId);
  } catch (e) {
    /* состояние перечитаем в любом случае */
  } finally {
    await refresh();
  }
}

function renderReserve(item, ctx) {
  if (!canSeeReservations(ctx)) return null;
  const box = el('div', { class: 'reserve' });
  const res = (ctx.reservations || []).find((r) => r.item_id === item.id);
  if (res) {
    box.appendChild(el('span', { class: 'reserve-label', text: reservationLabel(res) }));
    if (ctx.userId && res.user_id === ctx.userId) {
      const cancel = el('button', { class: 'btn btn-sm', type: 'button', text: 'Отменить' });
      cancel.addEventListener('click', () => cancelReservation(item.id));
      box.appendChild(cancel);
    }
  } else {
    const take = el('button', { class: 'btn btn-sm btn-primary', type: 'button', text: 'Я возьму' });
    take.addEventListener('click', () => reserveItem(item.id, ctx.user));
    box.appendChild(take);
  }
  return box;
}

function renderCard(item, ctx) {
  const card = el('article', { class: 'card' });
  const media = el('div', { class: 'card-media' });
  if (item.image_url) {
    media.appendChild(el('img', { class: 'card-img', src: item.image_url, alt: cardTitle(item), loading: 'lazy' }));
  } else {
    media.appendChild(el('div', { class: 'card-img placeholder', text: 'нет фото' }));
  }
  card.appendChild(media);

  const body = el('div', { class: 'card-body' });
  body.appendChild(el('h3', { class: 'card-title', text: cardTitle(item) || 'Без названия' }));

  const meta = el('div', { class: 'card-meta' });
  if (item.price) meta.appendChild(el('span', { class: 'price', text: formatPrice(item.price) }));
  if (item.store) meta.appendChild(el('span', { class: 'store', text: item.store }));
  body.appendChild(meta);

  body.appendChild(renderStars(item.rating));
  const tags = el('div', { class: 'card-tags' });
  tags.appendChild(statusBadge(item));
  if (item.category) tags.appendChild(el('span', { class: 'tag', text: item.category }));
  body.appendChild(tags);

  if (item.note) body.appendChild(el('p', { class: 'note', text: item.note }));
  if (item.url) body.appendChild(el('a', { class: 'card-link', href: item.url, target: '_blank', rel: 'noopener', text: 'Открыть ссылку' }));

  if (ctx && ctx.isAdmin) {
    const actions = el('div', { class: 'card-actions' });
    const editBtn = el('button', { class: 'btn btn-sm', type: 'button', text: 'Изменить' });
    editBtn.addEventListener('click', () => openItemForm(item));
    const delBtn = el('button', { class: 'btn btn-sm btn-danger', type: 'button', text: 'Удалить' });
    delBtn.addEventListener('click', async () => {
      try {
        await app.store.deleteItem(item.id);
      } catch (e) {
        /* перечитаем состояние ниже */
      }
      await refresh();
    });
    actions.append(editBtn, delBtn);
    body.appendChild(actions);
  }

  const reserveBox = renderReserve(item, ctx || {});
  if (reserveBox) body.appendChild(reserveBox);

  card.appendChild(body);
  return card;
}

function renderControls(items, current, onChange) {
  const cur = current || {};
  const bar = el('div', { class: 'controls' });
  const cats = Array.from(new Set((items || []).map((i) => i.category).filter(Boolean)));
  const catSel = el('select', { class: 'control' });
  const allOpt = el('option', { value: '', text: 'Все категории' });
  allOpt.selected = !cur.category;
  catSel.appendChild(allOpt);
  cats.forEach((c) => {
    const o = el('option', { value: c, text: c });
    o.selected = cur.category === c;
    catSel.appendChild(o);
  });

  const sortSel = el('select', { class: 'control' });
  const byDate = el('option', { value: 'date', text: 'Сначала новые' });
  const byRating = el('option', { value: 'rating', text: 'По звёздам' });
  const sort = cur.sort === 'rating' ? 'rating' : 'date';
  byDate.selected = sort === 'date';
  byRating.selected = sort === 'rating';
  sortSel.append(byDate, byRating);

  const search = el('input', { class: 'control', type: 'search', placeholder: 'Поиск по названию…' });
  search.value = cur.query || '';

  const emit = () => onChange({ category: catSel.value || null, sort: sortSel.value, query: search.value || '' });
  catSel.addEventListener('change', emit);
  sortSel.addEventListener('change', emit);
  search.addEventListener('input', emit);

  bar.append(catSel, sortSel, search);
  return bar;
}

function renderList(container, items, ctx) {
  if (!container) return;
  const c = ctx || {};
  const filtered = applyFilters(items || [], c.filter || {});
  container.innerHTML = '';
  if (!filtered.length) {
    container.appendChild(emptyState());
    return;
  }
  filtered.forEach((it) => container.appendChild(renderCard(it, c)));
}

const app = {
  store: createStore(),
  items: [],
  filter: { category: null, sort: 'date', query: '' },
  user: null,
  // В демо-режиме пользователь считается админом; при подключении Supabase

  isAdmin: true,
  reservations: [],
};

function updateAdminUi() {
  const b = document.getElementById('add-btn');
  if (b) b.style.display = app.isAdmin ? '' : 'none';
}

function renderAuthUi() {
  const slot = document.getElementById('auth-slot');
  if (!slot) return;
  slot.innerHTML = '';
  if (!useSupabase(SUPABASE_CONFIG)) return;
  if (app.user) {
    slot.appendChild(el('span', { class: 'auth-user', text: app.user.name || 'вы вошли' }));
    const out = el('button', { class: 'btn', type: 'button', text: 'Выйти' });
    out.addEventListener('click', () => signOut());
    slot.appendChild(out);
  } else {
    const email = el('input', { class: 'control', type: 'email', placeholder: 'email для входа' });
    const btn = el('button', { class: 'btn', type: 'button', text: 'Войти' });
    const note = el('span', { class: 'auth-note' });
    btn.addEventListener('click', async () => {
      if (!email.value) return;
      note.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Отправляю…';
      let error = null;
      try {
        const res = await signInWithEmail(email.value.trim());
        error = res && res.error ? res.error : null;
      } catch (e) {
        error = e;
      }
      btn.disabled = false;
      if (error) {
        btn.textContent = 'Войти';
        note.textContent = describeAuthError(error);
      } else {
        btn.textContent = 'Письмо отправлено';
        note.textContent = 'Проверьте почту и папку «Спам».';
      }
    });
    slot.append(email, btn, note);
  }
}

async function resolveAdmin(user) {
  return isAdmin(user && user.id);
}

async function loadSession() {
  app.user = await app.store.currentUser();
  app.isAdmin = await resolveAdmin(app.user);
  renderAuthUi();
  await refresh();
}

function drawList() {
  const listEl = document.getElementById('list');
  renderList(listEl, app.items, {
    isAdmin: app.isAdmin,
    reservations: app.reservations,
    userId: app.user && app.user.id,
    user: app.user,
    filter: app.filter,
  });
}

async function refresh() {
  app.items = await app.store.listItems();
  app.reservations = await app.store.listReservations();
  updateAdminUi();
  renderAuthUi();
  const controlsEl = document.getElementById('controls');
  if (controlsEl) {
    controlsEl.innerHTML = '';
    controlsEl.appendChild(
      renderControls(app.items, app.filter, (f) => {
        app.filter = f;
        drawList();
      })
    );
  }
  drawList();
}

/* ===== Парсинг ссылок ===== */
// Устанавливается при подключении Supabase (Задача 6); в демо-режиме остаётся null.
let parseLinkRemote = null;

function domainOf(url) {
  try {
    return new URL(String(url)).hostname.replace(/^www\./, '');
  } catch (e) {
    return '';
  }
}

async function parseLink(url) {
  if (typeof parseLinkRemote === 'function') {
    try {
      const r = await parseLinkRemote(url);
      if (r) {
        return {
          title: r.title || null,
          image_url: r.image_url || null,
          price: r.price || null,
          store: r.store || domainOf(url),
        };
      }
    } catch (e) {
      /* падаем в локальный фолбэк */
    }
  }
  return { title: null, image_url: null, price: null, store: domainOf(url) };
}

/* ===== Форма айтема ===== */
function fieldRow(labelText, value, type) {
  const wrap = el('label', { class: 'field' });
  wrap.appendChild(el('span', { class: 'field-label', text: labelText }));
  const input = el(type === 'textarea' ? 'textarea' : 'input', { class: 'field-input' });
  if (type === 'url') input.setAttribute('type', 'url');
  if (type === 'textarea') input.textContent = value == null ? '' : String(value);
  else input.setAttribute('value', value == null ? '' : String(value));
  wrap.appendChild(input);
  return { wrap, input };
}

function closeModal() {
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
}

function openItemForm(item) {
  const root = document.getElementById('modal-root');
  if (!root) return;
  const isEdit = !!item;
  const data = normalizeItem(item || {});
  root.innerHTML = '';

  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'modal' });
  modal.appendChild(el('h2', { class: 'modal-title', text: isEdit ? 'Редактировать айтем' : 'Новый айтем' }));

  const fUrl = fieldRow('Ссылка', data.url, 'url');
  const fTitle = fieldRow('Название', data.title);

  // Картинка: превью + загрузка файла (в Supabase Storage) + ручная ссылка
  const imageBlock = el('div', { class: 'field' });
  imageBlock.appendChild(el('span', { class: 'field-label', text: 'Картинка' }));
  const preview = el('img', { class: 'image-preview', alt: 'превью' });
  const imageUrlInput = el('input', { class: 'field-input', type: 'url', placeholder: 'ссылка на картинку' });
  imageUrlInput.value = data.image_url || '';
  const syncPreview = () => {
    const v = imageUrlInput.value.trim();
    if (v) {
      preview.setAttribute('src', v);
      preview.style.display = '';
    } else {
      preview.removeAttribute('src');
      preview.style.display = 'none';
    }
  };
  imageUrlInput.addEventListener('input', syncPreview);
  const fileInput = el('input', { class: 'hidden-file', type: 'file', accept: 'image/*' });
  const uploadBtn = el('button', { class: 'btn btn-sm', type: 'button', text: 'Загрузить фото' });
  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    uploadBtn.textContent = 'Загружаю…';
    try {
      const url = await app.store.uploadImage(file);
      imageUrlInput.value = url;
      syncPreview();
      uploadBtn.textContent = 'Загрузить фото';
    } catch (e) {
      uploadBtn.textContent = 'Ошибка загрузки';
    }
  });
  const clearImgBtn = el('button', { class: 'btn btn-sm', type: 'button', text: 'Убрать фото' });
  clearImgBtn.addEventListener('click', () => {
    imageUrlInput.value = '';
    syncPreview();
  });
  imageBlock.appendChild(preview);
  imageBlock.appendChild(el('div', { class: 'image-actions' }, [uploadBtn, clearImgBtn, fileInput]));
  imageBlock.appendChild(imageUrlInput);
  syncPreview();

  const fPrice = fieldRow('Цена, ₽', data.price);
  const fStore = fieldRow('Магазин', data.store);
  const fCategory = fieldRow('Категория', data.category);
  const ratingPicker = renderStarPicker(data.rating, null);
  const ratingWrap = el('div', { class: 'field' });
  ratingWrap.appendChild(el('span', { class: 'field-label', text: 'Оценка (клик по звезде; повторный клик — сброс)' }));
  ratingWrap.appendChild(ratingPicker.node);
  const fNote = fieldRow('Заметка: почему хочу / зачем / детали', data.note, 'textarea');

  const loadBtn = el('button', { class: 'btn', type: 'button', text: 'Загрузить из ссылки' });
  loadBtn.addEventListener('click', async () => {
    const url = fUrl.input.value.trim();
    if (!url) return;
    loadBtn.textContent = 'Загружаю…';
    const p = await parseLink(url);
    if (p.title && !fTitle.input.value) fTitle.input.value = p.title;
    if (p.image_url && !imageUrlInput.value) { imageUrlInput.value = p.image_url; syncPreview(); }
    if (p.price && !fPrice.input.value) fPrice.input.value = p.price;
    if (p.store && !fStore.input.value) fStore.input.value = p.store;
    loadBtn.textContent = 'Загрузить из ссылки';
  });

  const saveBtn = el('button', { class: 'btn btn-primary', type: 'button', text: 'Сохранить' });
  saveBtn.addEventListener('click', async () => {
    const payload = normalizeItem({
      id: data.id,
      title: fTitle.input.value,
      url: fUrl.input.value,
      image_url: imageUrlInput.value,
      price: fPrice.input.value,
      store: fStore.input.value,
      category: fCategory.input.value,
      rating: ratingPicker.value,
      note: fNote.input.value,
      created_at: data.created_at,
    });
    await app.store.saveItem(payload);
    closeModal();
    await refresh();
  });

  const cancelBtn = el('button', { class: 'btn', type: 'button', text: 'Отмена' });
  cancelBtn.addEventListener('click', closeModal);

  const form = el('div', { class: 'modal-form' });
  form.append(fUrl.wrap, loadBtn, fTitle.wrap, imageBlock, fPrice.wrap, fStore.wrap, fCategory.wrap, ratingWrap, fNote.wrap);
  modal.appendChild(form);
  modal.appendChild(el('div', { class: 'modal-actions' }, [cancelBtn, saveBtn]));
  overlay.appendChild(modal);
  root.appendChild(overlay);
}

/* ===== Тестовый харнесс (мини, без зависимостей) ===== */
let __passed = 0, __failed = 0;

function assertEqual(actual, expected, name) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  const line = (ok ? 'PASS' : 'FAIL') + ' — ' + name;
  if (ok) {
    __passed++;
  } else {
    __failed++;
    console.log('  expected', expected, 'got', actual);
  }
  console.log(line);
  if (typeof document !== 'undefined' && document.getElementById) {
    const out = document.getElementById('test-output');
    if (out) out.textContent += line + '\n';
  }
}

function memoryStorage() {
  const m = new Map();
  return {
    getItem: (k) => (m.has(k) ? m.get(k) : null),
    setItem: (k, v) => { m.set(k, String(v)); },
    removeItem: (k) => { m.delete(k); },
  };
}

async function runTests() {
  __passed = 0;
  __failed = 0;

  assertEqual(statusFromRating(5), 'очень хочу', '5 звёзд → очень хочу');

  const src = [{ title: 'A', rating: 2, category: 'g' }, { title: 'B', rating: 5, category: 'b' }];

  assertEqual(domainOf('http://sub.shop.io/x'), 'sub.shop.io', 'поддомен сохраняется');
  assertEqual(normalizeItem({ title: null, price: '1 299 ₽' }).price, '1 299 ₽', 'цена как текст');

  // Цена показывается в рублях
  assertEqual(formatPrice('2500'), '2500 ₽', 'число → рубли');
  assertEqual(formatPrice('1 299'), '1 299 ₽', 'число с пробелом → рубли');
  assertEqual(formatPrice('~300'), '~300 ₽', 'примерная цена → рубли');
  assertEqual(formatPrice('2500 ₽'), '2500 ₽', 'не дублирует знак рубля');
  assertEqual(formatPrice('2500 руб.'), '2500 руб.', 'не дублирует «руб.»');
  assertEqual(formatPrice('$20'), '$20', 'доллар не переделываем в рубли');
  assertEqual(formatPrice(''), '', 'пустая цена → пусто');
  assertEqual(formatPrice(null), '', 'null → пусто');
  assertEqual(formatPrice('дорого'), 'дорого', 'текст без цифр не трогаем');
  const priceCard = renderCard({ title: 'X', price: '2500' }, { isAdmin: false, reservations: [] });
  assertEqual(priceCard.children[1].children[1].children[0].textContent, '2500 ₽', 'в карточке цена с рублём');
  assertEqual((await parseLink('https://shop.io/x')).store, 'shop.io', 'сбой парсинга → домен как магазин');

  assertEqual(useSupabase({ url: '', key: '' }), false, 'пустые ключи → демо');
  assertEqual(useSupabase({ url: 'u', key: 'k' }), true, 'ключи есть → Supabase');

  // Понятные сообщения вместо молчаливого «письмо отправлено»

  const origStore = app.store;

    setReservation: async () => {
      throw new Error('duplicate');

    },

    await reserveItem('x', { id: 'u', name: 'n' });
    await cancelReservation('x');
  } catch (e) {
    threw = true;
  }
  assertEqual(threw, false, 'ошибка брони не пробрасывается наружу');

  assertEqual(nextRating(3, 3), 0, 'клик по текущей сбрасывает в 0');

  const s3 = new LocalStore(memoryStorage());
  const up = await s3.uploadImage({ name: 'a.png', type: 'image/png' });
  assertEqual(typeof up === 'string' && up.indexOf('data:') === 0, true, 'uploadImage в демо → data-URL');

  // Тесты не должны трогать общий localStorage

  assertEqual(localStorage.getItem('wishlist.reservations'), null, 'тесты не пишут брони в общий localStorage');

  return { passed: __passed, failed: __failed };
}

  runTests();
}

/* ===== Bootstrap (только браузер) ===== */
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('DOMContentLoaded', async () => {
    initTheme();
    const tt = document.getElementById('theme-toggle');
    if (tt) tt.addEventListener('click', toggleTheme);
    const addBtn = document.getElementById('add-btn');
    if (addBtn) addBtn.addEventListener('click', () => openItemForm(null));
    initSupabase();
    onAuthChange(() => loadSession());
    await loadSession();
  });
}
</script>
</body>
